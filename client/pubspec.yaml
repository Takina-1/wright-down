name: local_diary
description: "本地优先的文字日记开发预览版。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: ^13.3.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sync_core:
    path: ../packages/sync_core
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  # 仅测试用：home_page_photo_test 直接 import 这两个包来 mock file_picker 平台。
  cross_file: ^0.3.4
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

# sqlite3 is brought in only by host-side FFI tests. The Android app uses
# sqflite's platform implementation, not Dart FFI or a bundled SQLite binary.
# Avoid downloading an unused Android library during native-assets hooks.
hooks:
  user_defines:
    sqlite3:
      source:
        android: system
        default: sqlite3
