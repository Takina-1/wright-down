# F013 同步服务反向代理。只对外暴露 443，应用本身只听 127.0.0.1:8080。
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/diary-sync/server.crt;
    ssl_certificate_key /etc/nginx/ssl/diary-sync/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 照片上传经此代理转发（HDR/长焦照片可能 >8MB），放宽请求体上限；
    # 真正的瓶颈是 ECS 公网出向带宽（~3.4 Mbps），见
    # docs/superpowers/specs/腾讯云COS对象存储-tencent-cos-storage-design.md §3.3。
    client_max_body_size 16m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
